COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j8 -l12"
EMERGE_DEFAULT_OPTS="--jobs=3 --load-average=12"

LC_MESSAGES=C.UTF-8
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

GENTOO_MIRRORS="https://umbriel.br.ext.planetunix.net/pub/gentoo/ \
    https://br.mirrors.cicku.me/gentoo/ \
    https://distfiles.gentoo.org/"
ACCEPT_KEYWORDS="~amd64"

USE="X bluetooth dbus elogind wayland"

# GPU real del equipo: RX 6600 (Navi 23). Sin esto, mesa compila drivers de más.
VIDEO_CARDS="amdgpu radeonsi"
ABI_X86="64 32"
